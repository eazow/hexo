<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 684" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1480" height="684" fill="#fcfcfb"/><text x="740.0" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0b0b0b" xml:space="preserve">一条规则从文本到结构</text><text x="740.0" y="74" text-anchor="middle" font-size="14" font-weight="400" fill="#52514e" xml:space="preserve">规则头填进 Signature 的字段；每个选项交给对应关键字的 Setup()；解析完再转成检测时用的结构</text><rect x="40" y="104" width="1400" height="56" rx="10" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><rect x="62" y="118" width="247.60000000000002" height="28" rx="5" fill="#e3eefb"/><text x="64" y="138" text-anchor="start" font-size="14" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">alert http any any -&gt; any any</text><text x="307.6" y="138" text-anchor="start" font-size="14" font-weight="400" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve"> (</text><text x="324.40000000000003" y="138" text-anchor="start" font-size="14" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">msg:"Example";</text><text x="442.00000000000006" y="138" text-anchor="start" font-size="14" font-weight="400" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve"> </text><rect x="448.40000000000003" y="118" width="230.8" height="28" rx="5" fill="#ecebf7"/><text x="450.40000000000003" y="138" text-anchor="start" font-size="14" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">flow:established,to_server;</text><text x="677.2" y="138" text-anchor="start" font-size="14" font-weight="400" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve"> </text><rect x="683.6" y="118" width="79.60000000000001" height="28" rx="5" fill="#fff1e8"/><text x="685.6" y="138" text-anchor="start" font-size="14" font-weight="700" fill="#a8431c" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">http.uri;</text><text x="761.2" y="138" text-anchor="start" font-size="14" font-weight="400" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve"> </text><rect x="767.6" y="118" width="214.0" height="28" rx="5" fill="#fbeaf1"/><text x="769.6" y="138" text-anchor="start" font-size="14" font-weight="700" fill="#9e2f60" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">content:"/admin"; nocase;</text><text x="979.6" y="138" text-anchor="start" font-size="14" font-weight="400" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve"> </text><text x="988.0" y="138" text-anchor="start" font-size="14" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">sid:1000001; rev:1;</text><text x="1147.6" y="138" text-anchor="start" font-size="14" font-weight="400" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">)</text><rect x="40.0" y="200" width="453.3333333333333" height="250" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><text x="56.0" y="228" text-anchor="start" font-size="15" font-weight="700" fill="#1f5fae" xml:space="preserve">① 规则头 → Signature 字段</text><text x="56.0" y="246" text-anchor="start" font-size="12" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">SigParseBasics()</text><text x="56.0" y="280" text-anchor="start" font-size="12.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">alert</text><text x="212.0" y="280" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">s-&gt;action</text><text x="56.0" y="308" text-anchor="start" font-size="12.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">http</text><text x="212.0" y="308" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">s-&gt;alproto = HTTP，打上应用层标志</text><text x="56.0" y="336" text-anchor="start" font-size="12.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">any any</text><text x="212.0" y="336" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">源地址、源端口</text><text x="56.0" y="364" text-anchor="start" font-size="12.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">-&gt;</text><text x="212.0" y="364" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">方向</text><text x="56.0" y="392" text-anchor="start" font-size="12.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">any any</text><text x="212.0" y="392" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">目的地址、目的端口</text><text x="56.0" y="420" text-anchor="start" font-size="12.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">msg / sid / rev</text><text x="212.0" y="420" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">s-&gt;msg、s-&gt;id、s-&gt;rev(选项里的)</text><rect x="513.3333333333333" y="200" width="453.3333333333333" height="250" rx="10" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.5"/><text x="529.3333333333333" y="228" text-anchor="start" font-size="15" font-weight="700" fill="#4a3aa7" xml:space="preserve">② 选项 → 关键字的 Setup()</text><text x="529.3333333333333" y="246" text-anchor="start" font-size="12" font-weight="400" fill="#898781" xml:space="preserve">SigParseOptions()，在 sigmatch_table 里按名字查</text><text x="529.3333333333333" y="284" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">flow</text><text x="619.3333333333333" y="284" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">新建 SigMatch，加到 MATCH 链表</text><text x="529.3333333333333" y="324" text-anchor="start" font-size="12.5" font-weight="700" fill="#a8431c" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">http.uri</text><text x="619.3333333333333" y="324" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">不产生 SigMatch：把"当前链表"切到 http_uri</text><text x="529.3333333333333" y="364" text-anchor="start" font-size="12.5" font-weight="700" fill="#9e2f60" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">content</text><text x="619.3333333333333" y="364" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">新建 SigMatch，加到"当前链表"</text><text x="529.3333333333333" y="404" text-anchor="start" font-size="12.5" font-weight="700" fill="#9e2f60" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">nocase</text><text x="619.3333333333333" y="404" text-anchor="start" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">不产生 SigMatch：改前一个 content</text><rect x="986.6666666666666" y="200" width="453.3333333333333" height="250" rx="10" fill="#f3f2ed" stroke="#898781" stroke-width="1.5"/><text x="1002.6666666666666" y="228" text-anchor="start" font-size="15" font-weight="700" fill="#0b0b0b" xml:space="preserve">③ 解析阶段的存放：init_data</text><text x="1002.6666666666666" y="246" text-anchor="start" font-size="12" font-weight="400" fill="#898781" xml:space="preserve">临时结构，解析完就释放</text><text x="1002.6666666666666" y="282" text-anchor="start" font-size="12.5" font-weight="700" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">smlists[MATCH]</text><rect x="1156.6666666666665" y="264" width="150" height="30" rx="6" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.2"/><text x="1231.6666666666665" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">flow</text><text x="1002.6666666666666" y="312" text-anchor="start" font-size="11.5" font-weight="400" fill="#898781" xml:space="preserve">固定链表还有 PMATCH、POSTMATCH 等</text><text x="1002.6666666666666" y="350" text-anchor="start" font-size="12.5" font-weight="700" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">buffers[http_uri]</text><rect x="1156.6666666666665" y="332" width="150" height="30" rx="6" fill="#fbeaf1" stroke="#c2407a" stroke-width="1.2"/><text x="1231.6666666666665" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#9e2f60" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">"/admin" nocase</text><text x="1002.6666666666666" y="380" text-anchor="start" font-size="11.5" font-weight="400" fill="#898781" xml:space="preserve">每个缓冲区一条链表</text><text x="1002.6666666666666" y="414" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e" xml:space="preserve">没指定缓冲区时，content 默认</text><text x="1002.6666666666666" y="433" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e" xml:space="preserve">进 PMATCH，检查包载荷</text><line x1="493.3333333333333" y1="325" x2="505.33333333333326" y2="325" stroke="#898781" stroke-width="1.8"/><polygon points="505.33333333333326,320 505.33333333333326,330 513.3333333333333,325" fill="#898781"/><line x1="966.6666666666665" y1="325" x2="978.6666666666666" y2="325" stroke="#898781" stroke-width="1.8"/><polygon points="978.6666666666666,320 978.6666666666666,330 986.6666666666666,325" fill="#898781"/><line x1="740.0" y1="450" x2="740.0" y2="492" stroke="#eb6834" stroke-width="1.8"/><polygon points="735.0,492 745.0,492 740.0,500" fill="#eb6834"/><text x="752.0" y="480" text-anchor="start" font-size="12.5" font-weight="700" fill="#a8431c" xml:space="preserve">全部规则读完，SigGroupBuild() 里调用 SigMatchPrepare()</text><rect x="40" y="500" width="1400" height="150" rx="10" fill="#fff1e8" stroke="#eb6834" stroke-width="1.5"/><text x="60" y="530" text-anchor="start" font-size="15" font-weight="700" fill="#a8431c" xml:space="preserve">④ 检测时用的结构</text><text x="60" y="566" text-anchor="start" font-size="12.5" font-weight="700" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">s-&gt;sm_arrays[MATCH]</text><rect x="250" y="548" width="120" height="30" rx="6" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.2"/><text x="310" y="568" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">flow</text><text x="60" y="596" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e" xml:space="preserve">链表转成数组：检测时顺序遍历，</text><text x="60" y="614" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e" xml:space="preserve">每项调用关键字的 Match()</text><text x="540" y="566" text-anchor="start" font-size="12.5" font-weight="700" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">s-&gt;app_inspect</text><rect x="690" y="548" width="470" height="30" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.2"/><text x="704" y="568" text-anchor="start" font-size="12" font-weight="700" fill="#a8431c" xml:space="preserve">http_uri · HTTP/1 · to_server · 进度 ≥ LINE(请求行)</text><line x1="1160" y1="563" x2="1182" y2="563" stroke="#eb6834" stroke-width="1.8"/><polygon points="1182,558 1182,568 1190,563" fill="#eb6834"/><rect x="1190" y="548" width="150" height="30" rx="6" fill="#fbeaf1" stroke="#c2407a" stroke-width="1.2"/><text x="1265" y="568" text-anchor="middle" font-size="12" font-weight="700" fill="#9e2f60" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">"/admin"</text><rect x="690" y="590" width="470" height="30" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.2"/><text x="704" y="610" text-anchor="start" font-size="12" font-weight="700" fill="#a8431c" xml:space="preserve">http_uri · HTTP/2 · to_server</text><line x1="1160" y1="605" x2="1182" y2="605" stroke="#eb6834" stroke-width="1.8"/><polygon points="1182,600 1182,610 1190,605" fill="#eb6834"/><rect x="1190" y="590" width="150" height="30" rx="6" fill="#fbeaf1" stroke="#c2407a" stroke-width="1.2"/><text x="1265" y="610" text-anchor="middle" font-size="12" font-weight="700" fill="#9e2f60" font-family="'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">"/admin"</text><text x="540" y="634" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e" xml:space="preserve">按缓冲区挂上注册好的检查引擎；同一个 http.uri 规则，对 HTTP/1 和 HTTP/2 都生效</text></svg>