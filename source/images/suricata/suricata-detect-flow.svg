<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 658" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1480" height="658" fill="#fcfcfb"/><text x="740.0" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#0b0b0b">几万条规则一起跑：先分组，再预过滤，只细查少数几条</text><text x="740.0" y="74" text-anchor="middle" font-size="14" font-weight="400" fill="#52514e">上：启动时 SigGroupBuild() 建好规则组和 MPM；下：每个包在运行时走一遍</text><text x="40" y="108" text-anchor="start" font-size="15" font-weight="700" fill="#0b0b0b">启动时：建规则组</text><rect x="40" y="122" width="250" height="150" rx="10" fill="#f3f2ed" stroke="#898781" stroke-width="1.5"/><text x="54" y="147" text-anchor="start" font-size="14" font-weight="700" fill="#0b0b0b">全部规则(几万条)</text><text x="54" y="169" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">先排序：pass &gt; drop &gt; reject &gt; alert，</text><text x="54" y="188" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">再看 flowbits 依赖、优先级；</text><text x="54" y="207" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">排序后分配内部编号 iid</text><rect x="360" y="122" width="560" height="150" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><text x="374" y="147" text-anchor="start" font-size="14" font-weight="700" fill="#1f5fae">按 方向 × 协议 × 服务端端口 分组</text><text x="374" y="167" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">RulesGroupByPorts()：TCP/UDP 按端口；其他协议按协议号</text><rect x="374" y="182" width="260" height="34" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.1"/><text x="384" y="197" text-anchor="start" font-size="11.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace">to_server · TCP · 80</text><text x="384" y="211" text-anchor="start" font-size="10.5" font-weight="400" fill="#52514e">HTTP 规则 + any 端口规则</text><rect x="646" y="182" width="260" height="34" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.1"/><text x="656" y="197" text-anchor="start" font-size="11.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace">to_server · TCP · 443</text><text x="656" y="211" text-anchor="start" font-size="10.5" font-weight="400" fill="#52514e">TLS 规则 + any 端口规则</text><rect x="374" y="224" width="260" height="34" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.1"/><text x="384" y="239" text-anchor="start" font-size="11.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace">to_server · UDP · 53</text><text x="384" y="253" text-anchor="start" font-size="10.5" font-weight="400" fill="#52514e">DNS 规则 + any 端口规则</text><rect x="646" y="224" width="260" height="34" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.1"/><text x="656" y="239" text-anchor="start" font-size="11.5" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace">……</text><text x="656" y="253" text-anchor="start" font-size="10.5" font-weight="400" fill="#52514e">medium：最多 40 / 20 组</text><rect x="990" y="122" width="450" height="150" rx="10" fill="#fff1e8" stroke="#eb6834" stroke-width="1.5"/><text x="1004" y="147" text-anchor="start" font-size="14" font-weight="700" fill="#a8431c">每个组：用快速模式建 MPM</text><text x="1004" y="169" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">每条规则挑一个 content 当快速模式：</text><text x="1004" y="188" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">  显式 fast_pattern 优先；否则在优先级最高的</text><text x="1004" y="207" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">  缓冲区里挑最长的，一样长比模式强度</text><text x="1004" y="226" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">按缓冲区各建一个 MPM(Hyperscan 或 Aho-Corasick)</text><line x1="290" y1="197" x2="352" y2="197" stroke="#898781" stroke-width="1.8"/><polygon points="352,192 352,202 360,197" fill="#898781"/><line x1="920" y1="197" x2="982" y2="197" stroke="#898781" stroke-width="1.8"/><polygon points="982,192 982,202 990,197" fill="#898781"/><text x="40" y="324" text-anchor="start" font-size="15" font-weight="700" fill="#0b0b0b">运行时：一个包</text><rect x="40" y="334" width="320" height="112" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><text x="54" y="359" text-anchor="start" font-size="14" font-weight="700" fill="#1f5fae">① 找规则组</text><text x="54" y="381" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">方向 + 协议 + 服务端端口查表；</text><text x="54" y="400" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">查到后缓存在 Flow 上</text><text x="54" y="419" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">(sgh_toserver / sgh_toclient)</text><line x1="360" y1="390" x2="385" y2="390" stroke="#898781" stroke-width="1.8"/><polygon points="385,385 385,395 393,390" fill="#898781"/><rect x="393" y="334" width="320" height="112" rx="10" fill="#fff1e8" stroke="#eb6834" stroke-width="1.5"/><text x="407" y="359" text-anchor="start" font-size="14" font-weight="700" fill="#a8431c">② 预过滤</text><text x="407" y="381" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">MPM 在载荷、缓冲区上</text><text x="407" y="400" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">一次搜出所有快速模式；</text><text x="407" y="419" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">没有快速模式的规则直接算候选</text><line x1="713" y1="390" x2="738" y2="390" stroke="#898781" stroke-width="1.8"/><polygon points="738,385 738,395 746,390" fill="#898781"/><rect x="746" y="334" width="320" height="112" rx="10" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.5"/><text x="760" y="359" text-anchor="start" font-size="14" font-weight="700" fill="#4a3aa7">③ 整理候选</text><text x="760" y="381" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">命中的规则编号排序、去重</text><text x="760" y="400" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">→ match_array</text><text x="760" y="419" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">顺序就是规则的优先顺序</text><line x1="1066" y1="390" x2="1091" y2="390" stroke="#898781" stroke-width="1.8"/><polygon points="1091,385 1091,395 1099,390" fill="#898781"/><rect x="1099" y="334" width="320" height="112" rx="10" fill="#fbeaf1" stroke="#c2407a" stroke-width="1.5"/><text x="1113" y="359" text-anchor="start" font-size="14" font-weight="700" fill="#9e2f60">④ 逐条细查</text><text x="1113" y="381" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">规则头(协议、端口、地址、flow)</text><text x="1113" y="400" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">→ 其余条件逐个调 Match()</text><text x="1113" y="419" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">全部满足：产生告警</text><text x="200.0" y="484" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">几万条</text><text x="553.0" y="484" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">这一组的几千条</text><text x="906.0" y="484" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">命中快速模式的几十条</text><text x="1259.0" y="484" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">真正告警的 0 ~ 几条</text><text x="740.0" y="510" text-anchor="middle" font-size="11" font-weight="400" fill="#898781">(数量是示意，取决于规则集和流量)</text><rect x="40" y="536" width="1400" height="92" rx="10" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.5"/><text x="54" y="561" text-anchor="start" font-size="14" font-weight="700" fill="#4a3aa7">⑤ 应用层事务：同样先预过滤再细查，并且受事务进度约束</text><text x="54" y="583" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">DetectRunTx() 逐个事务：在 http_uri 这类缓冲区上跑 MPM 得到候选；检查引擎要求的进度还没到，就先停下，</text><text x="54" y="602" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">把检查到一半的状态存进事务的 de_state，等事务进度推进了再接着查(第 7、8 篇的事务进度在这里起作用)</text></svg>