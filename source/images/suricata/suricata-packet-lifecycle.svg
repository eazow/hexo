<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 750" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1480" height="750" fill="#fcfcfb"/><text x="740.0" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0b0b0b">一个 Packet 的一生</text><text x="740.0" y="74" text-anchor="middle" font-size="14" font-weight="400" fill="#52514e">AF_PACKET(TPACKET_V2)、workers 模式：从环里借一帧、从包池借一个 Packet，处理完各自归还</text><rect x="70.0" y="330" width="236" height="118" rx="12" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/><text x="86.0" y="360" text-anchor="start" font-size="15.5" font-weight="700" fill="#2a78d6">① 等待与取帧</text><text x="86.0" y="386" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">PacketPoolWait()：确保包池有空包</text><text x="86.0" y="406" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">poll() 等到帧状态变成</text><text x="86.0" y="426" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">TP_STATUS_USER</text><line x1="306.0" y1="389.0" x2="338.0" y2="389.0" stroke="#898781" stroke-width="2"/><polygon points="338.0,384.0 346.0,389.0 338.0,394.0" fill="#898781"/><rect x="346.0" y="330" width="236" height="118" rx="12" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.6"/><text x="362.0" y="360" text-anchor="start" font-size="15.5" font-weight="700" fill="#4a3aa7">② 取一个 Packet</text><text x="362.0" y="386" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">PacketGetFromQueueOrAlloc()</text><text x="362.0" y="406" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">先从本线程包池取，</text><text x="362.0" y="426" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">取不到才临时 malloc</text><line x1="582.0" y1="389.0" x2="614.0" y2="389.0" stroke="#898781" stroke-width="2"/><polygon points="614.0,384.0 622.0,389.0 614.0,394.0" fill="#898781"/><rect x="622.0" y="330" width="236" height="118" rx="12" fill="#fff1e8" stroke="#eb6834" stroke-width="1.6"/><text x="638.0" y="360" text-anchor="start" font-size="15.5" font-weight="700" fill="#eb6834">③ 装配</text><text x="638.0" y="386" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">PacketSetData()：ext_pkt 指向帧</text><text x="638.0" y="406" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">填 ts / livedev / datalink</text><text x="638.0" y="426" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">ReleasePacket = AFPReleasePacket</text><line x1="858.0" y1="389.0" x2="890.0" y2="389.0" stroke="#898781" stroke-width="2"/><polygon points="890.0,384.0 898.0,389.0 890.0,394.0" fill="#898781"/><rect x="898.0" y="330" width="236" height="118" rx="12" fill="#f3f2ed" stroke="#898781" stroke-width="1.6"/><text x="914.0" y="360" text-anchor="start" font-size="15.5" font-weight="700" fill="#0b0b0b">④ 流水线处理</text><text x="914.0" y="386" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">TmThreadsSlotProcessPkt()</text><text x="914.0" y="406" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">DecodeAFP → FlowWorker → …</text><text x="914.0" y="426" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">(第 2 篇)</text><line x1="1134.0" y1="389.0" x2="1166.0" y2="389.0" stroke="#898781" stroke-width="2"/><polygon points="1166.0,384.0 1174.0,389.0 1166.0,394.0" fill="#898781"/><rect x="1174.0" y="330" width="236" height="118" rx="12" fill="#fff1e8" stroke="#eb6834" stroke-width="1.6"/><text x="1190.0" y="360" text-anchor="start" font-size="15.5" font-weight="700" fill="#eb6834">⑤ 释放</text><text x="1190.0" y="386" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">TmqhOutputPacketpool()</text><text x="1190.0" y="406" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">最后调用 p->ReleasePacket(p)</text><text x="1190.0" y="426" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">也就是 AFPReleasePacket()</text><rect x="60" y="106" width="1360" height="132" rx="14" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/><text x="80" y="134" text-anchor="start" font-size="15.5" font-weight="700" fill="#2a78d6">AF_PACKET 环形缓冲区</text><text x="260" y="134" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">PACKET_RX_RING + mmap：内核和 Suricata 共用同一块内存，每一格(帧)靠 tp_status 交接</text><rect x="85.0" y="160" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="124.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">内核</text><text x="124.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">KERNEL</text><rect x="173.0" y="160" width="78" height="50" rx="7" fill="#e3eefb" stroke="#6da7ec" stroke-width="1.3"/><text x="212.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2a78d6">就绪</text><text x="212.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">USER</text><rect x="261.0" y="160" width="78" height="50" rx="7" fill="#e3eefb" stroke="#6da7ec" stroke-width="1.3"/><text x="300.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2a78d6">就绪</text><text x="300.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">USER</text><rect x="349.0" y="160" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="388.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">内核</text><text x="388.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">KERNEL</text><rect x="437.0" y="160" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="476.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">内核</text><text x="476.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">KERNEL</text><rect x="525.0" y="160" width="78" height="50" rx="7" fill="#e3eefb" stroke="#6da7ec" stroke-width="1.3"/><text x="564.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2a78d6">就绪</text><text x="564.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">USER</text><rect x="613.0" y="160" width="78" height="50" rx="7" fill="#e3eefb" stroke="#6da7ec" stroke-width="1.3"/><text x="652.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2a78d6">就绪</text><text x="652.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">USER</text><rect x="701.0" y="160" width="78" height="50" rx="7" fill="#fff1e8" stroke="#eb6834" stroke-width="1.3"/><text x="740.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#eb6834">借出中</text><text x="740.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#eb6834" font-family="'SF Mono', Menlo, Consolas, monospace">USER</text><rect x="789.0" y="160" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="828.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">内核</text><text x="828.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">KERNEL</text><rect x="877.0" y="160" width="78" height="50" rx="7" fill="#e3eefb" stroke="#6da7ec" stroke-width="1.3"/><text x="916.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2a78d6">就绪</text><text x="916.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">USER</text><rect x="965.0" y="160" width="78" height="50" rx="7" fill="#e3eefb" stroke="#6da7ec" stroke-width="1.3"/><text x="1004.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2a78d6">就绪</text><text x="1004.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">USER</text><rect x="1053.0" y="160" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="1092.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">内核</text><text x="1092.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">KERNEL</text><rect x="1141.0" y="160" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="1180.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">内核</text><text x="1180.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">KERNEL</text><rect x="1229.0" y="160" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="1268.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">已归还</text><text x="1268.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">KERNEL</text><rect x="1317.0" y="160" width="78" height="50" rx="7" fill="#e3eefb" stroke="#6da7ec" stroke-width="1.3"/><text x="1356.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2a78d6">就绪</text><text x="1356.0" y="199" text-anchor="middle" font-size="9.5" font-weight="400" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">USER</text><line x1="188.0" y1="238" x2="188.0" y2="322" stroke="#2a78d6" stroke-width="2"/><polygon points="183.0,322 193.0,322 188.0,330" fill="#2a78d6"/><text x="196.0" y="282" text-anchor="start" font-size="11.5" font-weight="400" fill="#2a78d6">内核写好一帧</text><line x1="740.0" y1="330" x2="740.0" y2="246" stroke="#eb6834" stroke-width="2" stroke-dasharray="6,4"/><polygon points="735.0,246 745.0,246 740.0,238" fill="#eb6834"/><text x="748.0" y="274" text-anchor="start" font-size="11.5" font-weight="700" fill="#eb6834">ext_pkt 指向这一帧</text><text x="748.0" y="292" text-anchor="start" font-size="11.5" font-weight="400" fill="#eb6834">零拷贝：数据一直留在环里</text><line x1="1292.0" y1="330" x2="1292.0" y2="246" stroke="#eb6834" stroke-width="2"/><polygon points="1287.0,246 1297.0,246 1292.0,238" fill="#eb6834"/><text x="1282.0" y="274" text-anchor="end" font-size="11.5" font-weight="700" fill="#eb6834" font-family="'SF Mono', Menlo, Consolas, monospace">AFPReleaseDataFromRing()</text><text x="1282.0" y="292" text-anchor="end" font-size="11.5" font-weight="400" fill="#eb6834">tp_status 设回 KERNEL，这一格还给内核</text><rect x="60" y="540" width="1360" height="126" rx="14" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.6"/><text x="80" y="646" text-anchor="start" font-size="15.5" font-weight="700" fill="#4a3aa7">本线程的包池</text><text x="192" y="646" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">thread_local 的 thread_pkt_pool，线程启动时预分配 max-pending-packets 个 Packet(默认 1024)，同线程取还不加锁</text><rect x="85.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="124.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="173.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="212.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="261.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="300.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="349.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="388.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="437.0" y="562" width="78" height="50" rx="7" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.3"/><text x="476.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#4a3aa7">取出</text><rect x="525.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="564.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="613.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="652.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="701.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="740.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="789.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="828.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="877.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="916.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="965.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="1004.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="1053.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="1092.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="1141.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="1180.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><rect x="1229.0" y="562" width="78" height="50" rx="7" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.3"/><text x="1268.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#4a3aa7">放回</text><rect x="1317.0" y="562" width="78" height="50" rx="7" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="1356.0" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">Packet</text><line x1="464.0" y1="540" x2="464.0" y2="456" stroke="#4a3aa7" stroke-width="2"/><polygon points="459.0,456 469.0,456 464.0,448" fill="#4a3aa7"/><text x="472.0" y="498" text-anchor="start" font-size="11.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">PacketPoolGetPacket()</text><line x1="1292.0" y1="448" x2="1292.0" y2="532" stroke="#4a3aa7" stroke-width="2"/><polygon points="1287.0,532 1297.0,532 1292.0,540" fill="#4a3aa7"/><text x="1282.0" y="498" text-anchor="end" font-size="11.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">PacketPoolReturnPacket()</text><text x="60" y="702" text-anchor="start" font-size="12.5" font-weight="400" fill="#52514e">释放之前，这一帧一直被 Packet 借着，内核不能往里写新数据；所以环的大小(ring-size)至少要装得下所有在途的包。</text><text x="60" y="724" text-anchor="start" font-size="12.5" font-weight="400" fill="#898781">TPACKET_V3 按块(block)读取和归还，一块里有多个包，整块处理完才还给内核；图中以逐帧交接的 V2 为例。</text></svg>