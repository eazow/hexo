ke-width="2.5"/><polygon points="1154,194.0 1162,200.0 1154,206.0" fill="#898781"/><rect x="1162" y="150" width="174" height="100" rx="14" fill="#1c5cab" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="1249.0" y="194.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">规则检测</text><text x="1249.0" y="218.0" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity="1">MPM + SGH</text><text x="1249.0" y="272" text-anchor="middle" font-size="12" fill="#898781">第8-9篇</text><line x1="1336" y1="200.0" x2="1350" y2="200.0" stroke="#898781" stroke-width="2.5"/><polygon points="1350,194.0 1358,200.0 1350,206.0" fill="#898781"/><rect x="1358" y="150" width="174" height="100" rx="14" fill="#184f95" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="1445.0" y="194.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">输出</text><text x="1445.0" y="218.0" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity="1">EVE JSON</text><text x="1445.0" y="272" text-anchor="middle" font-size="12" fill="#898781">第10篇</text></svg>