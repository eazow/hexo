<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 350" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1560" height="350" fill="#fcfcfb" rx="0"/><filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b0b0b" flood-opacity="0.18"/></filter><text x="780.0" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#0b0b0b">Suricata 数据包流水线总览</text><text x="780.0" y="82" text-anchor="middle" font-size="15" fill="#52514e">一个包从网卡钻进来，依次经过这几道工位，最后以 EVE JSON 事件的形式输出</text><rect x="40" y="175" width="120" height="100" rx="14" fill="#e1e0d9" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="100.0" y="219.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">流量来源</text><text x="100.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#0b0b0b" opacity="1">网卡 / PCAP 文件</text><line x1="160" y1="225.0" x2="174" y2="225.0" stroke="#898781" stroke-width="2.5"/><polygon points="174,219.0 182,225.0 174,231.0" fill="#898781"/><rect x="182" y="175" width="174" height="100" rx="14" fill="#6da7ec" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="269.0" y="219.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">捕获</text><text x="269.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#0b0b0b" opacity="1">AF_PACKET / PCAP / NFQ</text><text x="269.0" y="297" text-anchor="middle" font-size="12" fill="#898781">第3篇</text><line x1="356" y1="225.0" x2="370" y2="225.0" stroke="#898781" stroke-width="2.5"/><polygon points="370,219.0 378,225.0 370,231.0" fill="#898781"/><rect x="378" y="175" width="174" height="100" rx="14" fill="#5598e7" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="465.0" y="219.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">解码</text><text x="465.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#0b0b0b" opacity="1">Ether / IP / TCP</text><text x="465.0" y="297" text-anchor="middle" font-size="12" fill="#898781">第4篇</text><line x1="552" y1="225.0" x2="566" y2="225.0" stroke="#898781" stroke-width="2.5"/><polygon points="566,219.0 574,225.0 566,231.0" fill="#898781"/><rect x="574" y="175" width="174" height="100" rx="14" fill="#3987e5" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="661.0" y="219.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Flow</text><text x="661.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity="1">查找 / 建立</text><text x="661.0" y="297" text-anchor="middle" font-size="12" fill="#898781">第5篇</text><line x1="748" y1="225.0" x2="762" y2="225.0" stroke="#898781" stroke-width="2.5"/><polygon points="762,219.0 770,225.0 762,231.0" fill="#898781"/><rect x="770" y="175" width="174" height="100" rx="14" fill="#2a78d6" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="857.0" y="219.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Stream</text><text x="857.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity="1">TCP 重组(UDP 跳过)</text><text x="857.0" y="297" text-anchor="middle" font-size="12" fill="#898781">第6篇</text><line x1="944" y1="225.0" x2="958" y2="225.0" stroke="#898781" stroke-width="2.5"/><polygon points="958,219.0 966,225.0 958,231.0" fill="#898781"/><rect x="966" y="175" width="174" height="100" rx="14" fill="#256abf" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="1053.0" y="219.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">应用层解析</text><text x="1053.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity="1">HTTP / TLS ...</text><text x="1053.0" y="297" text-anchor="middle" font-size="12" fill="#898781">第7篇</text><line x1="1140" y1="225.0" x2="1154" y2="225.0" stroke="#898781" stroke-width="2.5"/><polygon points="1154,219.0 1162,225.0 1154,231.0" fill="#898781"/><rect x="1162" y="175" width="174" height="100" rx="14" fill="#1c5cab" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="1249.0" y="219.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">规则检测</text><text x="1249.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity="1">SGH + MPM</text><text x="1249.0" y="297" text-anchor="middle" font-size="12" fill="#898781">第8-9篇</text><line x1="1336" y1="225.0" x2="1350" y2="225.0" stroke="#898781" stroke-width="2.5"/><polygon points="1350,219.0 1358,225.0 1350,231.0" fill="#898781"/><rect x="1358" y="175" width="174" height="100" rx="14" fill="#184f95" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="1445.0" y="219.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">输出</text><text x="1445.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity="1">EVE JSON</text><text x="1445.0" y="297" text-anchor="middle" font-size="12" fill="#898781">第10篇</text><path d="M 574 169 L 574 161 L 1532 161 L 1532 169" fill="none" stroke="#898781" stroke-width="1.5"/><text x="1053.0" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#52514e">FlowWorker(同一个 TmModule)</text></svg>