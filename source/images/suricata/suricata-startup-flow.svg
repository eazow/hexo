<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1017" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b0b0b" flood-opacity="0.16"/></filter><rect x="0" y="0" width="900" height="1017" fill="#fcfcfb"/><text x="450.0" y="40" text-anchor="middle" font-size="26" fill="#0b0b0b" font-weight="700">main() 启动流程</text><rect x="350.0" y="68" width="200" height="56" rx="12" fill="#e1e0d9" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="450.0" y="101.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b0b0b">main()</text><line x1="450.0" y1="124" x2="450.0" y2="150" stroke="#898781" stroke-width="2.2"/><polygon points="444.0,150 456.0,150 450.0,158" fill="#898781"/><rect x="45.0" y="158" width="250" height="56" rx="12" fill="#6da7ec" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="170.0" y="183.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">SuricataPreInit()</text><text x="170.0" y="202.0" text-anchor="middle" font-size="11.5" fill="#0b0b0b">早期初始化</text><rect x="325.0" y="158" width="250" height="56" rx="12" fill="#6da7ec" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="450.0" y="183.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">SCParseCommandLine()</text><text x="450.0" y="202.0" text-anchor="middle" font-size="11.5" fill="#0b0b0b">argv → SCInstance</text><rect x="605.0" y="158" width="250" height="56" rx="12" fill="#6da7ec" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="730.0" y="183.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">SCLoadYamlConfig()</text><text x="730.0" y="202.0" text-anchor="middle" font-size="11.5" fill="#0b0b0b">加载 suricata.yaml</text><line x1="450.0" y1="214" x2="450.0" y2="240" stroke="#898781" stroke-width="2.2"/><polygon points="444.0,240 456.0,240 450.0,248" fill="#898781"/><rect x="70.0" y="248" width="760" height="305" rx="16" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="6,4"/><text x="92.0" y="276" text-anchor="start" font-size="16" fill="#0b0b0b" font-weight="700">SuricataInit()  —— 真正的初始化重头戏</text><text x="104.0" y="312" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">1. GlobalsInitPreConfig() — 内存分配器、随机种子</text><text x="104.0" y="339" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">2. 读取 yaml 配置项，配置日志系统 SCLogLoadConfig</text><text x="104.0" y="366" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">3. RunModeInitializeThreadSettings() — 线程数/亲和性</text><text x="104.0" y="393" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">4. ParseInterfacesList() — 监听哪些网卡/pcap</text><text x="104.0" y="420" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">5. PostConfLoadedSetup() — 各子系统初始化</text><text x="104.0" y="447" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">6. SCDropMainThreadCaps() — 权限收敛</text><text x="104.0" y="474" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">7. PostConfLoadedDetectSetup() — 检测引擎收尾</text><rect x="102.0" y="489" width="696" height="60" rx="12" fill="#4a3aa7" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="450.0" y="524.0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">8. RunModeDispatch()  —— 流水线在这一刻被焊起来并点火</text><line x1="450.0" y1="553" x2="450.0" y2="579" stroke="#898781" stroke-width="2.2"/><polygon points="444.0,579 456.0,579 450.0,587" fill="#898781"/><rect x="70.0" y="587" width="760" height="110" rx="16" fill="#f3f0fb" stroke="#4a3aa7" stroke-width="1.5"/><text x="94.0" y="613" text-anchor="start" font-size="14" fill="#4a3aa7" font-weight="700">RunModeDispatch() 内部</text><rect x="100.0" y="625" width="217.33333333333334" height="58" rx="12" fill="#4a3aa7" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="208.66666666666669" y="651.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">mode->RunModeFunc()</text><text x="208.66666666666669" y="670.0" text-anchor="middle" font-size="10.5" fill="#ffffff">组装 TmModule 流水线，创建工作线程</text><rect x="341.33333333333337" y="625" width="217.33333333333334" height="58" rx="12" fill="#4a3aa7" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="450.00000000000006" y="651.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">FlowManagerThreadSpawn() 等</text><text x="450.00000000000006" y="670.0" text-anchor="middle" font-size="10.5" fill="#ffffff">拉起 Flow 管理、统计、日志维护等线程</text><rect x="582.6666666666667" y="625" width="217.33333333333334" height="58" rx="12" fill="#4a3aa7" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="691.3333333333334" y="651.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">TmThreadsSealThreads()</text><text x="691.3333333333334" y="670.0" text-anchor="middle" font-size="10.5" fill="#ffffff">封口：之后不再允许创建新线程</text><line x1="450.0" y1="697" x2="450.0" y2="723" stroke="#898781" stroke-width="2.2"/><polygon points="444.0,723 456.0,723 450.0,731" fill="#898781"/><rect x="240.0" y="731" width="420" height="56" rx="12" fill="#6da7ec" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="450.0" y="756.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">SuricataPostInit()</text><text x="450.0" y="775.0" text-anchor="middle" font-size="11.5" fill="#0b0b0b">等待所有线程 init 完成</text><line x1="450.0" y1="787" x2="450.0" y2="813" stroke="#898781" stroke-width="2.2"/><polygon points="444.0,813 456.0,813 450.0,821" fill="#898781"/><rect x="220.0" y="821" width="460" height="66" rx="12" fill="#eb6834" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="450.0" y="851.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">SuricataMainLoop()</text><text x="450.0" y="870.0" text-anchor="middle" font-size="11.5" fill="#ffffff">主线程真正待着的地方：信号响应 + 健康检查</text><line x1="450.0" y1="887" x2="450.0" y2="913" stroke="#898781" stroke-width="2.2"/><polygon points="444.0,913 456.0,913 450.0,921" fill="#898781"/><rect x="240.0" y="921" width="420" height="56" rx="12" fill="#e1e0d9" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="450.0" y="946.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">SuricataShutdown() → GlobalsDestroy()</text><text x="450.0" y="965.0" text-anchor="middle" font-size="11.5" fill="#0b0b0b">杀线程、收尾、进程退出</text></svg>