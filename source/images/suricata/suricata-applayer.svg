<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 620" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1480" height="620" fill="#fcfcfb"/><text x="740.0" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#0b0b0b">应用层框架：先认出协议，再交给解析器，解析出一个个事务</text><text x="740.0" y="74" text-anchor="middle" font-size="14" font-weight="400" fill="#52514e">以 HTTP 为例；每个协议在启动时注册特征串、探测函数和一组解析回调，框架按协议号查表调用</text><rect x="40" y="110" width="250" height="104" rx="10" fill="#f3f2ed" stroke="#898781" stroke-width="1.5"/><text x="54" y="135" text-anchor="start" font-size="14" font-weight="700" fill="#0b0b0b" font-family="'SF Mono', Menlo, Consolas, monospace">AppLayerHandleTCPData()</text><text x="54" y="157" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">Stream 引擎交来一段</text><text x="54" y="176" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">已经拼好、已被 ACK 的数据</text><rect x="360" y="100" width="700" height="172" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><text x="374" y="125" text-anchor="start" font-size="14" font-weight="700" fill="#1f5fae">协议还不知道：协议识别</text><rect x="376" y="136" width="210" height="118" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/><text x="388" y="158" text-anchor="start" font-size="13" font-weight="700" fill="#1f5fae">① PM 特征串</text><text x="388" y="180" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">MPM 一次搜所有协议的特征</text><text x="388" y="199" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">HTTP：开头是 GET␣ / POST␣ …</text><text x="388" y="218" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">或 HTTP/1.1(响应方向)</text><path d="M 586 195 L 596 195" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="596,190 596,200 604,195" fill="#2a78d6"/><rect x="604" y="136" width="210" height="118" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/><text x="616" y="158" text-anchor="start" font-size="13" font-weight="700" fill="#1f5fae">② PP 按端口探测</text><text x="616" y="180" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">按端口挑出可能的协议，</text><text x="616" y="199" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">调用它的探测函数试一试</text><text x="616" y="218" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">例：DNS 默认端口 53</text><path d="M 814 195 L 824 195" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="824,190 824,200 832,195" fill="#2a78d6"/><rect x="832" y="136" width="210" height="118" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/><text x="844" y="158" text-anchor="start" font-size="13" font-weight="700" fill="#1f5fae">③ PE 期望</text><text x="844" y="180" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">别的连接事先登记好的</text><text x="844" y="199" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">例：FTP 协商出的</text><text x="844" y="218" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">数据连接</text><rect x="1130" y="110" width="310" height="104" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><text x="1144" y="135" text-anchor="start" font-size="14" font-weight="700" fill="#1f5fae">认出来了：f->alproto</text><text x="1144" y="157" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">记在 Flow 上，这条流以后</text><text x="1144" y="176" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">不再识别，直接解析</text><text x="1144" y="195" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">(STARTTLS 这类协议切换会重新识别)</text><path d="M 290 162 L 352 162" fill="none" stroke="#898781" stroke-width="1.8"/><polygon points="352,157 352,167 360,162" fill="#898781"/><text x="325" y="152" text-anchor="middle" font-size="11.5" font-weight="700" fill="#52514e">未知</text><path d="M 1060 162 L 1122 162" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="1122,157 1122,167 1130,162" fill="#2a78d6"/><rect x="40" y="320" width="420" height="128" rx="10" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.5"/><text x="54" y="345" text-anchor="start" font-size="14" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">AppLayerParserParse()</text><text x="54" y="367" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">按 (协议号, 应用层协议) 查出注册的回调，</text><text x="54" y="386" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">第一次先 StateAlloc() 建状态，挂到 f->alstate；</text><text x="54" y="405" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">再调用这个方向的 Parser[方向]：</text><text x="54" y="424" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">HTTP 是 HTPHandleRequestData() → Rust 版 libhtp</text><path d="M 100 214 L 100 312" fill="none" stroke="#4a3aa7" stroke-width="1.8"/><polygon points="95,312 105,312 100,320" fill="#4a3aa7"/><text x="110" y="254" text-anchor="start" font-size="11.5" font-weight="700" fill="#52514e">已知</text><path d="M 1285.0 214 L 1285.0 292 L 380 292 L 380 312" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="375,312 385,312 380,320" fill="#2a78d6"/><rect x="540" y="334" width="280" height="100" rx="10" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.5"/><text x="554" y="359" text-anchor="start" font-size="14" font-weight="700" fill="#4a3aa7">成功</text><text x="554" y="381" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">这段数据处理完了</text><rect x="840" y="334" width="280" height="100" rx="10" fill="#fff1e8" stroke="#eb6834" stroke-width="1.5"/><text x="854" y="359" text-anchor="start" font-size="14" font-weight="700" fill="#a8431c">数据不够</text><text x="854" y="381" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">返回 consumed / needed，needed 写进</text><text x="854" y="400" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">TCP 流的 data_required，攒够再调</text><rect x="1140" y="334" width="280" height="100" rx="10" fill="#fbeaf1" stroke="#c2407a" stroke-width="1.5"/><text x="1154" y="359" text-anchor="start" font-size="14" font-weight="700" fill="#9e2f60">出错 / 不收缺口</text><text x="1154" y="381" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">StreamTcpDisableAppLayer()：</text><text x="1154" y="400" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">这条流不再做应用层解析</text><path d="M 460 384 L 532 384" fill="none" stroke="#4a3aa7" stroke-width="1.8"/><polygon points="532,379 532,389 540,384" fill="#4a3aa7"/><text x="40" y="496" text-anchor="start" font-size="14" font-weight="700" fill="#0b0b0b">解析的产物：事务(transaction)，一问一答算一个</text><rect x="40" y="510" width="150" height="42" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/><text x="115.0" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace">NOT_STARTED</text><path d="M 190 531 L 202 531" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="202,526 202,536 210,531" fill="#2a78d6"/><rect x="210" y="510" width="150" height="42" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/><text x="285.0" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace">LINE</text><path d="M 360 531 L 372 531" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="372,526 372,536 380,531" fill="#2a78d6"/><rect x="380" y="510" width="150" height="42" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/><text x="455.0" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace">HEADERS</text><path d="M 530 531 L 542 531" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="542,526 542,536 550,531" fill="#2a78d6"/><rect x="550" y="510" width="150" height="42" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/><text x="625.0" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fae" font-family="'SF Mono', Menlo, Consolas, monospace">BODY</text><path d="M 700 531 L 712 531" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="712,526 712,536 720,531" fill="#2a78d6"/><rect x="720" y="510" width="150" height="42" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2"/><text x="795.0" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" font-family="'SF Mono', Menlo, Consolas, monospace">COMPLETE</text><text x="40" y="574" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">HTTP 请求方向的进度(响应方向同理)；两个方向都到 COMPLETE，事务才算完成</text><rect x="900" y="480" width="300" height="100" rx="10" fill="#fff1e8" stroke="#eb6834" stroke-width="1.5"/><text x="914" y="505" text-anchor="start" font-size="14" font-weight="700" fill="#a8431c">完成之后</text><text x="914" y="527" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">检测：按事务检查 HTTP 字段(第 8、9 篇)</text><text x="914" y="546" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">日志：写出一条 http 事件(第 10 篇)</text><path d="M 870 531 L 892 531" fill="none" stroke="#eb6834" stroke-width="1.8"/><polygon points="892,526 892,536 900,531" fill="#eb6834"/><rect x="1220" y="480" width="220" height="100" rx="10" fill="#f3f2ed" stroke="#898781" stroke-width="1.5"/><text x="1234" y="505" text-anchor="start" font-size="14" font-weight="700" fill="#0b0b0b">释放</text><text x="1234" y="527" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">检测和日志都处理过，</text><text x="1234" y="546" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">TransactionsCleanup()</text><text x="1234" y="565" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">才把它释放</text><path d="M 1200 531 L 1212 531" fill="none" stroke="#898781" stroke-width="1.8"/><polygon points="1212,526 1212,536 1220,531" fill="#898781"/></svg>