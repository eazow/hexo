<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 640" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1480" height="640" fill="#fcfcfb"/><text x="740.0" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0b0b0b">从规则命中到一行 JSON</text><text x="740.0" y="74" text-anchor="middle" font-size="14" font-weight="400" fill="#52514e">告警先攒进队列再统一收尾；日志按类型分发，各模块按条件或事务进度写出；EVE 拼成一行 JSON 写出去</text><rect x="40" y="104" width="300" height="118" rx="10" fill="#fbeaf1" stroke="#c2407a" stroke-width="1.5"/><text x="54" y="129" text-anchor="start" font-size="14" font-weight="700" fill="#9e2f60">规则命中</text><text x="54" y="151" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">AlertQueueAppend()：</text><text x="54" y="170" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">先放进本线程的告警队列，</text><text x="54" y="189" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">不立即生效</text><rect x="400" y="104" width="520" height="118" rx="10" fill="#fbeaf1" stroke="#c2407a" stroke-width="1.5"/><text x="414" y="129" text-anchor="start" font-size="14" font-weight="700" fill="#9e2f60">包检测完：PacketAlertFinalize()</text><text x="414" y="151" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">按规则顺序排序 → 逐条做抑制、阈值检查 →</text><text x="414" y="170" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">执行 drop、pass 这类动作 →</text><text x="414" y="189" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">写进 p-&gt;alerts，每个包最多 15 条(packet-alert-max)，</text><text x="414" y="208" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">被抑制的、超出上限的只计数</text><rect x="980" y="104" width="460" height="118" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><text x="994" y="129" text-anchor="start" font-size="14" font-weight="700" fill="#1f5fae">FlowWorker 最后一步：OutputLoggerLog()</text><text x="994" y="151" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">对每个包都调用(第 5 篇)，</text><text x="994" y="170" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">依次调用几类根日志器</text><line x1="340" y1="163" x2="392" y2="163" stroke="#c2407a" stroke-width="1.8"/><polygon points="392,158 392,168 400,163" fill="#c2407a"/><line x1="920" y1="163" x2="972" y2="163" stroke="#898781" stroke-width="1.8"/><polygon points="972,158 972,168 980,163" fill="#898781"/><text x="40" y="256" text-anchor="start" font-size="14" font-weight="700" fill="#0b0b0b">几类根日志器(OutputRegisterRootLoggers())，各自管一批日志模块</text><rect x="40" y="300" width="450" height="118" rx="10" fill="#fbeaf1" stroke="#c2407a" stroke-width="1.5"/><text x="54" y="325" text-anchor="start" font-size="14" font-weight="700" fill="#9e2f60">包</text><text x="81" y="325" text-anchor="start" font-size="12" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">OutputPacketLog()</text><text x="54" y="350" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">每个模块带一个条件函数</text><text x="54" y="370" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">alert：p-&gt;alerts.cnt &gt; 0 才写</text><text x="54" y="390" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">另有 drop、anomaly 等</text><rect x="515" y="300" width="450" height="118" rx="10" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.5"/><text x="529" y="325" text-anchor="start" font-size="14" font-weight="700" fill="#4a3aa7">事务</text><text x="571" y="325" text-anchor="start" font-size="12" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">OutputTxLog()</text><text x="529" y="350" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">逐个事务、逐个模块判断：</text><text x="529" y="370" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">事务进度够了才写，写完打标记</text><text x="529" y="390" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">http：两个方向都完成才写</text><rect x="990" y="300" width="450" height="118" rx="10" fill="#f3f2ed" stroke="#898781" stroke-width="1.5"/><text x="1004" y="325" text-anchor="start" font-size="14" font-weight="700" fill="#0b0b0b">文件 / 文件数据 / 流式</text><text x="1004" y="350" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">fileinfo、filestore、</text><text x="1004" y="370" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">按流写原始数据等</text><line x1="1040" y1="222" x2="1040" y2="278" stroke="#898781" stroke-width="1.8"/><line x1="265.0" y1="278" x2="1215.0" y2="278" stroke="#898781" stroke-width="1.8"/><line x1="265.0" y1="278" x2="265.0" y2="292" stroke="#898781" stroke-width="1.8"/><polygon points="260.0,292 270.0,292 265.0,300" fill="#898781"/><line x1="740.0" y1="278" x2="740.0" y2="292" stroke="#898781" stroke-width="1.8"/><polygon points="735.0,292 745.0,292 740.0,300" fill="#898781"/><line x1="1215.0" y1="278" x2="1215.0" y2="292" stroke="#898781" stroke-width="1.8"/><polygon points="1210.0,292 1220.0,292 1215.0,300" fill="#898781"/><rect x="40" y="456" width="450" height="128" rx="10" fill="#fff1e8" stroke="#eb6834" stroke-width="1.5"/><text x="54" y="481" text-anchor="start" font-size="14" font-weight="700" fill="#a8431c">拼 JSON：JsonBuilder(Rust 实现)</text><text x="54" y="503" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">CreateEveHeader()：所有事件共用的头</text><text x="54" y="522" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">timestamp、flow_id、event_type、</text><text x="54" y="541" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">五元组、pkt_src、tx_id …</text><text x="54" y="560" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">再加各模块自己的字段</text><rect x="550" y="456" width="430" height="128" rx="10" fill="#fff1e8" stroke="#eb6834" stroke-width="1.5"/><text x="564" y="481" text-anchor="start" font-size="14" font-weight="700" fill="#a8431c">alert 事件多了什么</text><text x="564" y="503" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">"alert"：action、signature_id、rev、</text><text x="564" y="522" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">signature、category、severity …</text><text x="564" y="541" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">可选：命中事务的应用层字段(如 http)、</text><text x="564" y="560" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">payload、flow 信息</text><rect x="1040" y="456" width="400" height="128" rx="10" fill="#fff1e8" stroke="#eb6834" stroke-width="1.5"/><text x="1054" y="481" text-anchor="start" font-size="14" font-weight="700" fill="#a8431c">写出去：OutputJsonBuilderBuffer()</text><text x="1054" y="503" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">拼好的一行放进本线程的缓冲区，</text><text x="1054" y="522" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">LogFileWrite() 写到 eve.json；</text><text x="1054" y="541" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">filetype 也可以是 syslog、</text><text x="1054" y="560" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">unix socket 或 redis</text><line x1="490" y1="520" x2="542" y2="520" stroke="#eb6834" stroke-width="1.8"/><polygon points="542,515 542,525 550,520" fill="#eb6834"/><line x1="980" y1="520" x2="1032" y2="520" stroke="#eb6834" stroke-width="1.8"/><polygon points="1032,515 1032,525 1040,520" fill="#eb6834"/><line x1="265" y1="418" x2="265" y2="448" stroke="#c2407a" stroke-width="1.8"/><polygon points="260,448 270,448 265,456" fill="#c2407a"/><line x1="740" y1="418" x2="740" y2="448" stroke="#4a3aa7" stroke-width="1.8"/><polygon points="735,448 745,448 740,456" fill="#4a3aa7"/><text x="40" y="616" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">不走这条路的：flow 日志在流被回收时由 FlowRecycler 调 OutputFlowLog() 写出(第 5 篇)；stats 日志由专门的统计线程定时写出。</text></svg>