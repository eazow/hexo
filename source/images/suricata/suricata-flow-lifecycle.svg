<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 762" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1480" height="762" fill="#fcfcfb"/><text x="740.0" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0b0b0b">一条 Flow 的一生</text><text x="740.0" y="74" text-anchor="middle" font-size="14" font-weight="400" fill="#52514e">从备用池取出，在流表里随包更新状态，过期后经两条路线之一回收，最后写 flow 日志、清空，还回备用池</text><rect x="40" y="110" width="250" height="132" rx="12" fill="#f3f2ed" stroke="#898781" stroke-width="1.6"/><text x="56" y="138" text-anchor="start" font-size="15" font-weight="700" fill="#898781">备用池</text><text x="56" y="162" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">线程私有的 spare_queue(不加锁)</text><text x="56" y="182" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">全局备用池：启动时预分配</text><text x="56" y="202" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">flow.prealloc 个(默认 10000)</text><rect x="390" y="110" width="640" height="170" rx="12" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/><text x="406" y="138" text-anchor="start" font-size="15" font-weight="700" fill="#2a78d6">流表里：一条活跃的 Flow</text><rect x="410" y="150" width="170" height="56" rx="9" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.3"/><text x="495.0" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">NEW</text><text x="495.0" y="195" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">超时 TCP 60 秒</text><path d="M 580 178 L 608 178" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="608,173 608,183 616,178" fill="#2a78d6"/><rect x="616" y="150" width="170" height="56" rx="9" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.3"/><text x="701.0" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">ESTABLISHED</text><text x="701.0" y="195" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">超时 TCP 600 秒</text><path d="M 786 178 L 814 178" fill="none" stroke="#2a78d6" stroke-width="1.8"/><polygon points="814,173 814,183 822,178" fill="#2a78d6"/><rect x="822" y="150" width="170" height="56" rx="9" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.3"/><text x="907.0" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#2a78d6" font-family="'SF Mono', Menlo, Consolas, monospace">CLOSED</text><text x="907.0" y="195" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">超时 TCP 60 秒</text><text x="410" y="232" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">每来一个包：lastts = 包的时间，按方向累加包数、字节数</text><text x="410" y="254" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">状态一变，FlowUpdateState() 就重新计算 timeout_policy</text><rect x="1110" y="110" width="330" height="132" rx="12" fill="#fff1e8" stroke="#eb6834" stroke-width="1.6"/><text x="1126" y="138" text-anchor="start" font-size="15" font-weight="700" fill="#eb6834">过期了</text><text x="1126" y="162" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">lastts + timeout_policy</text><text x="1126" y="182" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">早于当前包的时间</text><text x="1126" y="202" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">(用的是包的时间戳，不是系统时钟)</text><path d="M 290 176 L 382 176" fill="none" stroke="#898781" stroke-width="1.8"/><polygon points="382,171 382,181 390,176" fill="#898781"/><text x="330" y="166" text-anchor="middle" font-size="11.5" font-weight="700" fill="#898781">FlowGetNew()</text><path d="M 1030 176 L 1102 176" fill="none" stroke="#eb6834" stroke-width="1.8"/><polygon points="1102,171 1102,181 1110,176" fill="#eb6834"/><rect x="390" y="340" width="330" height="112" rx="12" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.6"/><text x="406" y="368" text-anchor="start" font-size="15" font-weight="700" fill="#4a3aa7">① worker 线程顺手清理</text><text x="406" y="392" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">查流表时路过、发现超时，移出哈希桶</text><text x="406" y="412" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">放进本线程的工作队列，</text><text x="406" y="432" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">由 CheckWorkQueue() 收尾</text><rect x="780" y="340" width="330" height="112" rx="12" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.6"/><text x="796" y="368" text-anchor="start" font-size="15" font-weight="700" fill="#4a3aa7">② FlowManager 巡检</text><text x="796" y="392" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">每秒扫至少 10% 的哈希桶</text><text x="796" y="412" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">紧急模式下每 250 毫秒扫完整张表</text><text x="796" y="432" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">超时的流移出哈希桶</text><rect x="1170" y="340" width="270" height="112" rx="12" fill="#ecebf7" stroke="#4a3aa7" stroke-width="1.6"/><text x="1186" y="368" text-anchor="start" font-size="15" font-weight="700" fill="#4a3aa7">FlowRecycler</text><text x="1186" y="392" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">专门的回收线程</text><text x="1186" y="412" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">从回收队列里成批取流</text><rect x="780" y="490" width="330" height="92" rx="12" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.6" stroke-dasharray="6,4"/><text x="796" y="518" text-anchor="start" font-size="15" font-weight="700" fill="#4a3aa7">TCP 流还有没处理完的数据？</text><text x="796" y="542" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">FlowSendToLocalThread() 交回所属 worker，</text><text x="796" y="562" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">用伪包把剩下的数据冲刷一遍</text><path d="M 1215.0 242 L 1215.0 300 L 555.0 300 L 555.0 332" fill="none" stroke="#4a3aa7" stroke-width="1.8"/><polygon points="550.0,332 560.0,332 555.0,340" fill="#4a3aa7"/><path d="M 945.0 300 L 945.0 332" fill="none" stroke="#4a3aa7" stroke-width="1.8"/><polygon points="940.0,332 950.0,332 945.0,340" fill="#4a3aa7"/><path d="M 1110 396 L 1162 396" fill="none" stroke="#4a3aa7" stroke-width="1.8"/><polygon points="1162,391 1162,401 1170,396" fill="#4a3aa7"/><text x="1140" y="386" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a3aa7">无残留</text><path d="M 945.0 452 L 945.0 482" fill="none" stroke="#4a3aa7" stroke-width="1.8" stroke-dasharray="6,4"/><polygon points="940.0,482 950.0,482 945.0,490" fill="#4a3aa7"/><text x="955.0" y="476" text-anchor="start" font-size="11.5" font-weight="700" fill="#4a3aa7">有</text><path d="M 780 536.0 L 555.0 536.0 L 555.0 460" fill="none" stroke="#4a3aa7" stroke-width="1.8" stroke-dasharray="6,4"/><polygon points="550.0,460 560.0,460 555.0,452" fill="#4a3aa7"/><rect x="390" y="630" width="1050" height="92" rx="12" fill="#fff1e8" stroke="#eb6834" stroke-width="1.6"/><text x="406" y="658" text-anchor="start" font-size="15" font-weight="700" fill="#eb6834">收尾：两条路线都走到这里</text><text x="406" y="682" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">OutputFlowLog() 写一条 EVE flow 日志：开始/结束时间、两个方向的包数和字节数、结束原因</text><text x="406" y="702" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">FlowClearMemory() 释放 TCP 会话、应用层状态等挂在 Flow 上的东西，然后还回备用池</text><path d="M 460 452 L 460 622" fill="none" stroke="#eb6834" stroke-width="1.8"/><polygon points="455,622 465,622 460,630" fill="#eb6834"/><path d="M 1305.0 452 L 1305.0 622" fill="none" stroke="#eb6834" stroke-width="1.8"/><polygon points="1300.0,622 1310.0,622 1305.0,630" fill="#eb6834"/><path d="M 390 676 L 358 676 L 358 215 L 298 215" fill="none" stroke="#898781" stroke-width="1.8"/><polygon points="298,210 298,220 290,215" fill="#898781"/><text x="350" y="666" text-anchor="end" font-size="11.5" font-weight="700" fill="#898781">还回备用池</text><rect x="40" y="340" width="290" height="150" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/><text x="56" y="368" text-anchor="start" font-size="15" font-weight="700" fill="#c0392b">内存超过 flow.memcap</text><text x="56" y="392" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">进入紧急模式：</text><text x="56" y="412" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">· 换成更短的紧急超时</text><text x="56" y="432" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">· 唤醒 FlowManager 加紧回收</text><text x="56" y="452" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">· FlowGetUsedFlow() 抢一条旧流</text><path d="M 105.0 242 L 105.0 332" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4"/><polygon points="100.0,332 110.0,332 105.0,340" fill="#c0392b"/><text x="115.0" y="276" text-anchor="start" font-size="11.5" font-weight="700" fill="#c0392b">池空且超上限</text></svg>