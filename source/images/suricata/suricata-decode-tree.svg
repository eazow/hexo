<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 660" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1480" height="660" fill="#fcfcfb"/><text x="740.0" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#0b0b0b">解码分发树：一层层剥开，每一层决定下一层交给谁</text><text x="740.0" y="74" text-anchor="middle" font-size="14" font-weight="400" fill="#52514e">蓝色是开头 curl 那个 HTTP 包走的路；紫色是会生出新 Packet 的分支(隧道、分片)</text><text x="40" y="124" text-anchor="start" font-size="13" font-weight="700" fill="#0b0b0b">入口：按 datalink</text><text x="300" y="124" text-anchor="start" font-size="13" font-weight="700" fill="#0b0b0b">链路层：按 eth_type</text><text x="560" y="124" text-anchor="start" font-size="13" font-weight="700" fill="#0b0b0b">网络层：按 ip proto</text><text x="830" y="124" text-anchor="start" font-size="13" font-weight="700" fill="#0b0b0b">传输层 / 隧道</text><text x="1110" y="124" text-anchor="start" font-size="13" font-weight="700" fill="#0b0b0b">之后</text><rect x="40" y="150" width="220" height="40" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.3"/><text x="52" y="174.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeAFP()</text><rect x="40" y="202" width="220" height="40" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.3"/><text x="52" y="219" text-anchor="start" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeLinkLayer()</text><text x="52" y="235" text-anchor="start" font-size="10.5" font-weight="400" fill="#ffffff">switch (p->datalink)</text><line x1="150.0" y1="190" x2="150.0" y2="196" stroke="#2a78d6" stroke-width="1.6"/><polygon points="145.5,196 154.5,196 150.0,202" fill="#2a78d6"/><rect x="300" y="202" width="220" height="40" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.3"/><text x="312" y="226.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeEthernet()</text><rect x="300" y="254" width="220" height="40" rx="8" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="312" y="271" text-anchor="start" font-size="12.5" font-weight="700" fill="#52514e" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeSll() 等</text><text x="312" y="287" text-anchor="start" font-size="10.5" font-weight="400" fill="#52514e">Linux cooked / PPP / Raw …</text><path d="M 260 222.0 L 276 222.0 L 276 222.0 L 293 222.0" fill="none" stroke="#2a78d6" stroke-width="1.6"/><polygon points="293,217.5 300,222.0 293,226.5" fill="#2a78d6"/><path d="M 260 222.0 L 276 222.0 L 276 274.0 L 293 274.0" fill="none" stroke="#b9b7ad" stroke-width="1.6"/><polygon points="293,269.5 300,274.0 293,278.5" fill="#b9b7ad"/><rect x="560" y="150" width="230" height="40" rx="8" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="572" y="167" text-anchor="start" font-size="12.5" font-weight="700" fill="#52514e" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeVLAN()</text><text x="572" y="183" text-anchor="start" font-size="10.5" font-weight="400" fill="#52514e">剥掉标签，再回到这一层</text><path d="M 520 222.0 L 536 222.0 L 536 170.0 L 553 170.0" fill="none" stroke="#b9b7ad" stroke-width="1.6"/><polygon points="553,165.5 560,170.0 553,174.5" fill="#b9b7ad"/><rect x="560" y="202" width="230" height="40" rx="8" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="572" y="226.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#52514e" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeMPLS()</text><path d="M 520 222.0 L 536 222.0 L 536 222.0 L 553 222.0" fill="none" stroke="#b9b7ad" stroke-width="1.6"/><polygon points="553,217.5 560,222.0 553,226.5" fill="#b9b7ad"/><rect x="560" y="254" width="230" height="40" rx="8" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="572" y="278.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#52514e" font-family="'SF Mono', Menlo, Consolas, monospace">DecodePPPOESession()</text><path d="M 520 222.0 L 536 222.0 L 536 274.0 L 553 274.0" fill="none" stroke="#b9b7ad" stroke-width="1.6"/><polygon points="553,269.5 560,274.0 553,278.5" fill="#b9b7ad"/><rect x="560" y="306" width="230" height="40" rx="8" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="572" y="330.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#52514e" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeARP()</text><path d="M 520 222.0 L 536 222.0 L 536 326.0 L 553 326.0" fill="none" stroke="#b9b7ad" stroke-width="1.6"/><polygon points="553,321.5 560,326.0 553,330.5" fill="#b9b7ad"/><rect x="560" y="358" width="230" height="40" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.3"/><text x="572" y="382.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeIPV4()</text><path d="M 520 222.0 L 536 222.0 L 536 378.0 L 553 378.0" fill="none" stroke="#2a78d6" stroke-width="1.6"/><polygon points="553,373.5 560,378.0 553,382.5" fill="#2a78d6"/><rect x="560" y="410" width="230" height="40" rx="8" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="572" y="434.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#52514e" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeIPV6()</text><path d="M 520 222.0 L 536 222.0 L 536 430.0 L 553 430.0" fill="none" stroke="#b9b7ad" stroke-width="1.6"/><polygon points="553,425.5 560,430.0 553,434.5" fill="#b9b7ad"/><rect x="830" y="150" width="240" height="40" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.3"/><text x="842" y="174.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeTCP()</text><path d="M 790 378.0 L 806 378.0 L 806 170.0 L 823 170.0" fill="none" stroke="#2a78d6" stroke-width="1.6"/><polygon points="823,165.5 830,170.0 823,174.5" fill="#2a78d6"/><rect x="830" y="202" width="240" height="40" rx="8" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="842" y="219" text-anchor="start" font-size="12.5" font-weight="700" fill="#52514e" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeUDP()</text><text x="842" y="235" text-anchor="start" font-size="10.5" font-weight="400" fill="#52514e">按端口认 VXLAN / Geneve / Teredo</text><path d="M 790 378.0 L 806 378.0 L 806 222.0 L 823 222.0" fill="none" stroke="#b9b7ad" stroke-width="1.6"/><polygon points="823,217.5 830,222.0 823,226.5" fill="#b9b7ad"/><rect x="830" y="254" width="240" height="40" rx="8" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="842" y="278.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#52514e" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeICMPV4()</text><path d="M 790 378.0 L 806 378.0 L 806 274.0 L 823 274.0" fill="none" stroke="#b9b7ad" stroke-width="1.6"/><polygon points="823,269.5 830,274.0 823,278.5" fill="#b9b7ad"/><rect x="830" y="306" width="240" height="40" rx="8" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.3"/><text x="842" y="330.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#52514e" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeSCTP() / DecodeESP()</text><path d="M 790 378.0 L 806 378.0 L 806 326.0 L 823 326.0" fill="none" stroke="#b9b7ad" stroke-width="1.6"/><polygon points="823,321.5 830,326.0 823,330.5" fill="#b9b7ad"/><rect x="830" y="358" width="240" height="40" rx="8" fill="#ecebf7" stroke="#8a7fd0" stroke-width="1.3"/><text x="842" y="375" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">DecodeGRE()</text><text x="842" y="391" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a3aa7">GRE 隧道</text><path d="M 790 378.0 L 806 378.0 L 806 378.0 L 823 378.0" fill="none" stroke="#8a7fd0" stroke-width="1.6"/><polygon points="823,373.5 830,378.0 823,382.5" fill="#8a7fd0"/><rect x="830" y="410" width="240" height="40" rx="8" fill="#ecebf7" stroke="#8a7fd0" stroke-width="1.3"/><text x="842" y="427" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">IPIP / IPv6-in-IPv4</text><text x="842" y="443" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a3aa7">ip proto 4 / 41</text><path d="M 790 378.0 L 806 378.0 L 806 430.0 L 823 430.0" fill="none" stroke="#8a7fd0" stroke-width="1.6"/><polygon points="823,425.5 830,430.0 823,434.5" fill="#8a7fd0"/><rect x="830" y="462" width="240" height="40" rx="8" fill="#ecebf7" stroke="#8a7fd0" stroke-width="1.3"/><text x="842" y="479" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">Defrag()</text><text x="842" y="495" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a3aa7">分片(MF 或 offset>0)：先攒齐再重组</text><path d="M 790 378.0 L 806 378.0 L 806 482.0 L 823 482.0" fill="none" stroke="#8a7fd0" stroke-width="1.6"/><polygon points="823,477.5 830,482.0 823,486.5" fill="#8a7fd0"/><rect x="1110" y="150" width="330" height="40" rx="8" fill="#eb6834" stroke="#eb6834" stroke-width="1.3"/><text x="1122" y="167" text-anchor="start" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'SF Mono', Menlo, Consolas, monospace">FlowSetupPacket()</text><text x="1122" y="183" text-anchor="start" font-size="10.5" font-weight="400" fill="#ffffff">打上 PKT_WANTS_FLOW，算好 flow_hash → 第 5 篇</text><path d="M 1070 170.0 L 1086 170.0 L 1086 170.0 L 1103 170.0" fill="none" stroke="#eb6834" stroke-width="1.6"/><polygon points="1103,165.5 1110,170.0 1103,174.5" fill="#eb6834"/><rect x="1110" y="358" width="330" height="40" rx="8" fill="#ecebf7" stroke="#8a7fd0" stroke-width="1.3"/><text x="1122" y="375" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">PacketTunnelPktSetup()</text><text x="1122" y="391" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a3aa7">新 Packet 拷贝内层数据，root 指向外层</text><rect x="1110" y="462" width="330" height="40" rx="8" fill="#ecebf7" stroke="#8a7fd0" stroke-width="1.3"/><text x="1122" y="479" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">PacketDefragPktSetup()</text><text x="1122" y="495" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a3aa7">拼好的新 Packet，再调 DecodeIPV4()</text><path d="M 1070 222.0 L 1086 222.0 L 1086 378.0 L 1103 378.0" fill="none" stroke="#8a7fd0" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="1103,373.5 1110,378.0 1103,382.5" fill="#8a7fd0"/><path d="M 1070 378.0 L 1086 378.0 L 1086 378.0 L 1103 378.0" fill="none" stroke="#8a7fd0" stroke-width="1.6"/><polygon points="1103,373.5 1110,378.0 1103,382.5" fill="#8a7fd0"/><path d="M 1070 430.0 L 1086 430.0 L 1086 378.0 L 1103 378.0" fill="none" stroke="#8a7fd0" stroke-width="1.6"/><polygon points="1103,373.5 1110,378.0 1103,382.5" fill="#8a7fd0"/><path d="M 1070 482.0 L 1086 482.0 L 1086 482.0 L 1103 482.0" fill="none" stroke="#8a7fd0" stroke-width="1.6"/><polygon points="1103,477.5 1110,482.0 1103,486.5" fill="#8a7fd0"/><rect x="1110" y="410" width="330" height="40" rx="8" fill="#ecebf7" stroke="#8a7fd0" stroke-width="1.3"/><text x="1122" y="427" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">tv->decode_pq</text><text x="1122" y="443" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a3aa7">新 Packet 排在这里，解码完再走后面的工位</text><line x1="1275.0" y1="398" x2="1275.0" y2="403" stroke="#8a7fd0" stroke-width="1.6"/><polygon points="1270.5,403 1279.5,403 1275.0,410" fill="#8a7fd0"/><line x1="1275.0" y1="462" x2="1275.0" y2="457" stroke="#8a7fd0" stroke-width="1.6"/><polygon points="1270.5,457 1279.5,457 1275.0,450" fill="#8a7fd0"/><rect x="40" y="538" width="1400" height="92" rx="12" fill="#fcfcfb" stroke="#dcdad2" stroke-width="1.2"/><text x="60" y="566" text-anchor="start" font-size="14" font-weight="700" fill="#0b0b0b">每一层的固定套路</text><text x="60" y="594" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">① 长度够不够  →  ② PacketIncreaseCheckLayers()：层数不超过 max-layers(默认 16)  →  ③ PacketSetXxx()：把头部指针记进 p->l2 / l3 / l4  →  ④ 按类型字段调用下一层</text><text x="60" y="616" text-anchor="start" font-size="12" font-weight="400" fill="#c24e1f">任何一步不过：ENGINE_SET_INVALID_EVENT() 记一个解码事件，提前返回；包不会进流表，但仍会经过检测和输出。</text></svg>