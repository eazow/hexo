<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 690" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b0b0b" flood-opacity="0.16"/></filter><rect x="0" y="0" width="1480" height="690" fill="#fcfcfb"/><text x="740.0" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#0b0b0b">线程模型：TmModule 怎么变成一条正在跑的流水线</text><text x="740.0" y="80" text-anchor="middle" font-size="15" fill="#52514e">workers / single / autofp 三种排班方式的拓扑差异</text><text x="60" y="117" text-anchor="start" font-size="15" fill="#0b0b0b" font-weight="700">① 一份说明书，发给工人后变成上岗单</text><rect x="60" y="135" width="190" height="64" rx="12" fill="#e1e0d9" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="155.0" y="163.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b0b0b">TmModule</text><text x="155.0" y="183.0" text-anchor="middle" font-size="11.5" fill="#0b0b0b">岗位说明书（全局唯一）</text><line x1="250" y1="167.0" x2="373" y2="167.0" stroke="#898781" stroke-width="2"/><polygon points="373,162.0 380,167.0 373,172.0" fill="#898781"/><text x="315.0" y="157.0" text-anchor="middle" font-size="11.5" fill="#52514e" font-weight="400">TmSlotSetFuncAppend()</text><rect x="380" y="135" width="190" height="64" rx="12" fill="#2a78d6" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="475.0" y="163.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">TmSlot</text><text x="475.0" y="183.0" text-anchor="middle" font-size="11.5" fill="#ffffff">某工人的上岗单</text><line x1="570" y1="167.0" x2="693" y2="167.0" stroke="#898781" stroke-width="2"/><polygon points="693,162.0 700,167.0 693,172.0" fill="#898781"/><text x="635.0" y="157.0" text-anchor="middle" font-size="11.5" fill="#52514e" font-weight="400">挂到 tm_slots 链表</text><rect x="700" y="135" width="190" height="64" rx="12" fill="#4a3aa7" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="795.0" y="163.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">ThreadVars</text><text x="795.0" y="183.0" text-anchor="middle" font-size="11.5" fill="#ffffff">一个工人的档案卡</text><text x="914" y="172.0" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">一个 ThreadVars 可挂一串 TmSlot（slot_next 链）</text><line x1="40" y1="233" x2="1440" y2="233" stroke="#e1e0d9" stroke-width="1.5"/><text x="60" y="273" text-anchor="start" font-size="15" fill="#0b0b0b" font-weight="700">② workers（single 是它在“1 线程 / 1 网卡”下的特例）</text><rect x="60" y="297" width="900" height="110" rx="16" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#softshadow)"/><text x="510.0" y="357.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b0b0b"></text><text x="78" y="319" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">一个 ThreadVars（一个线程），驱动方式 pktacqloop</text><rect x="90" y="333" width="175" height="56" rx="10" fill="#2a78d6" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="177.5" y="366.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">ReceiveAFP</text><line x1="265" y1="361.0" x2="288" y2="361.0" stroke="#898781" stroke-width="2"/><polygon points="288,356.0 295,361.0 288,366.0" fill="#898781"/><rect x="295" y="333" width="175" height="56" rx="10" fill="#2a78d6" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="382.5" y="366.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">DecodeAFP</text><line x1="470" y1="361.0" x2="493" y2="361.0" stroke="#898781" stroke-width="2"/><polygon points="493,356.0 500,361.0 493,366.0" fill="#898781"/><rect x="500" y="333" width="175" height="56" rx="10" fill="#eb6834" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="587.5" y="366.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">FlowWorker</text><line x1="675" y1="361.0" x2="698" y2="361.0" stroke="#898781" stroke-width="2"/><polygon points="698,356.0 705,361.0 698,366.0" fill="#898781"/><rect x="705" y="333" width="175" height="56" rx="10" fill="#eb6834" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="792.5" y="366.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">RespondReject</text><text x="510.0" y="429" text-anchor="middle" font-size="12" fill="#52514e" font-weight="400">in / out 都是 packetpool，包全程不离开这个线程</text><text x="60" y="463" text-anchor="start" font-size="15" fill="#0b0b0b" font-weight="700">③ autofp：两组线程，中间用 pickup 队列接力</text><rect x="60" y="487" width="420" height="110" rx="16" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#softshadow)"/><text x="270.0" y="547.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b0b0b"></text><text x="78" y="509" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">Receive 线程组，驱动方式 pktacqloop</text><rect x="84" y="523" width="170" height="56" rx="10" fill="#2a78d6" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="169.0" y="556.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">ReceiveAFP</text><line x1="254" y1="551.0" x2="273" y2="551.0" stroke="#898781" stroke-width="2"/><polygon points="273,546.0 280,551.0 273,556.0" fill="#898781"/><rect x="280" y="523" width="170" height="56" rx="10" fill="#2a78d6" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="365.0" y="556.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">DecodeAFP</text><line x1="480" y1="542.0" x2="523" y2="542.0" stroke="#4a3aa7" stroke-width="2"/><polygon points="523,537.0 530,542.0 523,547.0" fill="#4a3aa7"/><rect x="530" y="487" width="200" height="110" rx="12" fill="#4a3aa7" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="630.0" y="538.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">pickup1..N</text><text x="630.0" y="558.0" text-anchor="middle" font-size="11.5" fill="#ffffff">按 p->flow_hash % N 分发</text><text x="630.0" y="617" text-anchor="middle" font-size="12" fill="#52514e" font-weight="400">同一条流永远落进同一条队列</text><line x1="730" y1="542.0" x2="773" y2="542.0" stroke="#4a3aa7" stroke-width="2"/><polygon points="773,537.0 780,542.0 773,547.0" fill="#4a3aa7"/><rect x="780" y="487" width="380" height="110" rx="16" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#softshadow)"/><text x="970.0" y="547.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b0b0b"></text><text x="798" y="509" text-anchor="start" font-size="12.5" fill="#52514e" font-weight="400">Worker 线程组，驱动方式 varslot</text><rect x="804" y="523" width="155" height="56" rx="10" fill="#eb6834" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="881.5" y="556.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">FlowWorker</text><line x1="959" y1="551.0" x2="972" y2="551.0" stroke="#898781" stroke-width="2"/><polygon points="972,546.0 979,551.0 972,556.0" fill="#898781"/><rect x="979" y="523" width="155" height="56" rx="10" fill="#eb6834" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="1056.5" y="556.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">RespondReject</text></svg>