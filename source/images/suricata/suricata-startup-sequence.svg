<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1200" height="950" fill="#fcfcfb"/><filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b0b0b" flood-opacity="0.16"/></filter><text x="600.0" y="40" text-anchor="middle" font-size="24" fill="#0b0b0b" font-weight="700" font-style="normal">启动过程中：谁在什么时候被谁拉起来</text><text x="600.0" y="66" text-anchor="middle" font-size="14" fill="#52514e" font-weight="400" font-style="normal">主线程 / 抓包+检测工作线程 / 管理线程，三条时间线</text><rect x="50.0" y="100" width="260" height="56" rx="10" fill="#e1e0d9" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="180.0" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">主线程</text><text x="180.0" y="143.0" text-anchor="middle" font-size="10.5" fill="#0b0b0b">main() 一路跑下来的那条线</text><rect x="490.0" y="100" width="260" height="56" rx="10" fill="#2a78d6" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="620.0" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">工作线程组</text><text x="620.0" y="143.0" text-anchor="middle" font-size="10.5" fill="#ffffff">Receive→Decode→FlowWorker→…</text><rect x="890.0" y="100" width="260" height="56" rx="10" fill="#4a3aa7" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="1020.0" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">管理线程组</text><text x="1020.0" y="143.0" text-anchor="middle" font-size="10.5" fill="#ffffff">FlowManager / Stats / LogMaintenance</text><line x1="180" y1="156" x2="180" y2="656" stroke="#c3c2b7" stroke-width="1.8" stroke-dasharray="5,5"/><rect x="163.0" y="186" width="34" height="70" rx="6" fill="#898781"/><text x="210" y="204" text-anchor="start" font-size="12" fill="#52514e" font-weight="400" font-style="normal">PreInit → ParseCommandLine → LoadYamlConfig</text><text x="210" y="222" text-anchor="start" font-size="12" fill="#52514e" font-weight="400" font-style="normal">→ SuricataInit() 前 7 步（单线程）</text><line x1="180" y1="302" x2="612" y2="302" stroke="#2a78d6" stroke-width="2"/><polygon points="612,297 620,302 612,307" fill="#2a78d6"/><text x="400.0" y="294" text-anchor="middle" font-size="11.5" fill="#2a78d6" font-weight="700" font-style="normal">RunModeDispatch() 里 TmThreadSpawn()</text><line x1="180" y1="342" x2="1012" y2="342" stroke="#4a3aa7" stroke-width="2"/><polygon points="1012,337 1020,342 1012,347" fill="#4a3aa7"/><text x="600.0" y="334" text-anchor="middle" font-size="11.5" fill="#4a3aa7" font-weight="700" font-style="normal">FlowManagerThreadSpawn() 等</text><line x1="620" y1="292" x2="620" y2="702" stroke="#6da7ec" stroke-width="1.8" stroke-dasharray="5,5"/><line x1="1020" y1="332" x2="1020" y2="702" stroke="#9085e9" stroke-width="1.8" stroke-dasharray="5,5"/><line x1="620" y1="392" x2="208" y2="392" stroke="#898781" stroke-width="2" stroke-dasharray="5,4"/><polygon points="208,387 200,392 208,397" fill="#898781"/><text x="410.0" y="384" text-anchor="middle" font-size="11.5" fill="#898781" font-weight="400" font-style="normal">THV_INIT_DONE</text><line x1="1020" y1="418" x2="208" y2="418" stroke="#898781" stroke-width="2" stroke-dasharray="5,4"/><polygon points="208,413 200,418 208,423" fill="#898781"/><text x="610.0" y="410" text-anchor="middle" font-size="11.5" fill="#898781" font-weight="400" font-style="normal">THV_INIT_DONE</text><rect x="163.0" y="452" width="34" height="44" rx="6" fill="#898781"/><text x="210" y="478" text-anchor="start" font-size="12" fill="#52514e" font-weight="400" font-style="normal">SuricataPostInit() — 等所有线程 init 完成</text><rect x="85.0" y="526" width="190" height="170" rx="10" fill="#eb6834"/><text x="180" y="605.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700" font-style="normal">SuricataMainLoop()</text><text x="180" y="625.0" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="400" font-style="normal">信号响应 + 健康检查</text><rect x="525.0" y="526" width="190" height="170" rx="10" fill="#2a78d6"/><text x="620" y="605.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700" font-style="normal">抓包 → 解码 → 检测 → 输出</text><text x="620" y="625.0" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="400" font-style="normal">各自循环，互不等待</text><rect x="925.0" y="526" width="190" height="170" rx="10" fill="#4a3aa7"/><text x="1020" y="605.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700" font-style="normal">flow 超时清理</text><text x="1020" y="625.0" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="400" font-style="normal">统计 / 日志轮转</text><text x="600.0" y="720" text-anchor="middle" font-size="13" fill="#898781" font-weight="400" font-style="italic">三条线并发跑，谁也不等谁</text><line x1="120" y1="756" x2="172" y2="756" stroke="#898781" stroke-width="2"/><polygon points="172,751 180,756 172,761" fill="#898781"/><text x="110" y="760" text-anchor="end" font-size="11.5" fill="#52514e" font-weight="400" font-style="normal">SIGINT / SIGTERM</text><line x1="180" y1="792" x2="612" y2="792" stroke="#898781" stroke-width="2" stroke-dasharray="5,4"/><polygon points="612,787 620,792 612,797" fill="#898781"/><text x="400.0" y="784" text-anchor="middle" font-size="11.5" fill="#898781" font-weight="400" font-style="normal">TmThreadKillThreads() / THV_KILL</text><line x1="180" y1="822" x2="1012" y2="822" stroke="#898781" stroke-width="2" stroke-dasharray="5,4"/><polygon points="1012,817 1020,822 1012,827" fill="#898781"/><text x="600.0" y="814" text-anchor="middle" font-size="11.5" fill="#898781" font-weight="400" font-style="normal">THV_KILL</text><rect x="30.0" y="868" width="300" height="52" rx="10" fill="#e1e0d9" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="180.0" y="899.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">SuricataShutdown() → GlobalsDestroy()</text></svg>