<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 662" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1480" height="662" fill="#fcfcfb"/><text x="740.0" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0b0b0b">TCP 重组：一个方向上的字节流</text><text x="740.0" y="74" text-anchor="middle" font-size="14" font-weight="400" fill="#52514e">段按序号放进红黑树(seg_tree)，数据拷进流式缓冲区(sb)；IDS 模式下，只有被对方 ACK 的部分才交给应用层</text><line x1="120" y1="116" x2="1360" y2="116" stroke="#c3c2b7" stroke-width="1.5"/><line x1="120.0" y1="112" x2="120.0" y2="120" stroke="#c3c2b7" stroke-width="1.5"/><text x="120.0" y="106" text-anchor="middle" font-size="11" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">+0</text><line x1="297.1428571428571" y1="112" x2="297.1428571428571" y2="120" stroke="#c3c2b7" stroke-width="1.5"/><text x="297.1428571428571" y="106" text-anchor="middle" font-size="11" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">+200</text><line x1="474.2857142857143" y1="112" x2="474.2857142857143" y2="120" stroke="#c3c2b7" stroke-width="1.5"/><text x="474.2857142857143" y="106" text-anchor="middle" font-size="11" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">+400</text><line x1="651.4285714285714" y1="112" x2="651.4285714285714" y2="120" stroke="#c3c2b7" stroke-width="1.5"/><text x="651.4285714285714" y="106" text-anchor="middle" font-size="11" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">+600</text><line x1="828.5714285714286" y1="112" x2="828.5714285714286" y2="120" stroke="#c3c2b7" stroke-width="1.5"/><text x="828.5714285714286" y="106" text-anchor="middle" font-size="11" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">+800</text><line x1="1005.7142857142857" y1="112" x2="1005.7142857142857" y2="120" stroke="#c3c2b7" stroke-width="1.5"/><text x="1005.7142857142857" y="106" text-anchor="middle" font-size="11" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">+1000</text><line x1="1182.857142857143" y1="112" x2="1182.857142857143" y2="120" stroke="#c3c2b7" stroke-width="1.5"/><text x="1182.857142857143" y="106" text-anchor="middle" font-size="11" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">+1200</text><line x1="1360.0" y1="112" x2="1360.0" y2="120" stroke="#c3c2b7" stroke-width="1.5"/><text x="1360.0" y="106" text-anchor="middle" font-size="11" font-weight="400" fill="#898781" font-family="'SF Mono', Menlo, Consolas, monospace">+1400</text><text x="40" y="120" text-anchor="start" font-size="12" font-weight="700" fill="#52514e">序号</text><text x="40" y="162" text-anchor="start" font-size="12" font-weight="700" fill="#52514e">收到的段</text><text x="40" y="182" text-anchor="start" font-size="11" font-weight="400" fill="#898781">#号 = 到达顺序</text><rect x="121.0" y="140" width="263.7142857142857" height="34" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><text x="252.85714285714286" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">#1</text><rect x="386.7142857142857" y="140" width="263.7142857142857" height="34" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><text x="518.5714285714286" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">#3 乱序，后到</text><rect x="652.4285714285714" y="140" width="263.71428571428567" height="34" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><text x="784.2857142857142" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">#2</text><rect x="1183.857142857143" y="140" width="175.1428571428571" height="34" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><text x="1271.4285714285716" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">#6</text><rect x="652.4285714285714" y="182" width="263.71428571428567" height="34" rx="6" fill="#f3f2ed" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="6,4"/><text x="784.2857142857142" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">#4 重传，数据相同：不重复存</text><rect x="873.8571428571429" y="224" width="175.1428571428571" height="34" rx="6" fill="#fff1e8" stroke="#eb6834" stroke-width="1.5"/><text x="961.4285714285714" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#a8431c">#5 与 #2 重叠</text><text x="40" y="312" text-anchor="start" font-size="12" font-weight="700" fill="#52514e">缓冲区 sb</text><rect x="120.0" y="290" width="930.0" height="34" rx="6" fill="#d5e5f8" stroke="#2a78d6" stroke-width="1.5"/><rect x="1052.0" y="290" width="128.8571428571429" height="34" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5" stroke-dasharray="5,4"/><text x="1147.4285714285713" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">没抓到</text><rect x="1182.857142857143" y="290" width="177.1428571428571" height="34" rx="6" fill="#d5e5f8" stroke="#2a78d6" stroke-width="1.5"/><text x="385.7142857142857" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fae">按序号拼成连续的字节</text><line x1="651.4285714285714" y1="134" x2="651.4285714285714" y2="350" stroke="#4a3aa7" stroke-width="2" stroke-dasharray="3,3"/><polygon points="646.4285714285714,350 656.4285714285714,350 651.4285714285714,342" fill="#4a3aa7"/><text x="651.4285714285714" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#4a3aa7" font-family="'SF Mono', Menlo, Consolas, monospace">app_progress：应用层读到这里</text><line x1="1094.2857142857142" y1="134" x2="1094.2857142857142" y2="350" stroke="#eb6834" stroke-width="2" stroke-dasharray="3,3"/><polygon points="1089.2857142857142,350 1099.2857142857142,350 1094.2857142857142,342" fill="#eb6834"/><text x="1094.2857142857142" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#a8431c" font-family="'SF Mono', Menlo, Consolas, monospace">last_ack：对方确认收到这里</text><path d="M 122.0 394 L 122.0 402 L 649.4285714285714 402 L 649.4285714285714 394" fill="none" stroke="#898781" stroke-width="1.6"/><text x="385.7142857142857" y="422" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">已经交给应用层</text><path d="M 653.4285714285714 394 L 653.4285714285714 402 L 1048.0 402 L 1048.0 394" fill="none" stroke="#4a3aa7" stroke-width="1.6"/><text x="850.7142857142858" y="422" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">被对方 ACK 了：交给应用层</text><text x="850.7142857142858" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">AppLayerHandleTCPData()</text><path d="M 1184.857142857143 394 L 1184.857142857143 402 L 1358.0 402 L 1358.0 394" fill="none" stroke="#2a78d6" stroke-width="1.6"/><text x="1271.4285714285716" y="422" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">收到了，对方还没 ACK</text><text x="1271.4285714285716" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">先存着，等 ACK</text><path d="M 1052.0 394 L 1052.0 402 L 1092.2857142857142 402 L 1092.2857142857142 394" fill="none" stroke="#a8431c" stroke-width="1.6"/><line x1="1072.142857142857" y1="402" x2="1072.142857142857" y2="458" stroke="#a8431c" stroke-width="1.2"/><text x="1072.142857142857" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a8431c">缺口：ACK 了却没抓到</text><text x="1072.142857142857" y="492" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">通知应用层 STREAM_GAP</text><rect x="120.0" y="524" width="400.0" height="104" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.4"/><text x="134.0" y="550" text-anchor="start" font-size="14" font-weight="700" fill="#1f5fae">乱序与重传</text><text x="134.0" y="574" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">段按序号插进红黑树，先后无所谓；</text><text x="134.0" y="593" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">数据按序号拷进缓冲区的对应位置。</text><text x="134.0" y="612" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">重传的段数据相同，不重复存。</text><rect x="540.0" y="524" width="400.0" height="104" rx="10" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.4"/><text x="554.0" y="550" text-anchor="start" font-size="14" font-weight="700" fill="#a8431c">重叠：同一段序号两份数据</text><text x="554.0" y="574" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">数据不同时，按目标主机的操作系统策略</text><text x="554.0" y="593" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">决定用哪份(IDS)，或把包改回先到的那份(inline)；</text><text x="554.0" y="612" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">开启检查时记 overlap_different_data 事件。</text><rect x="960.0" y="524" width="400.0" height="104" rx="10" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.4"/><text x="974.0" y="550" text-anchor="start" font-size="14" font-weight="700" fill="#4a3aa7">为什么等 ACK</text><text x="974.0" y="574" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">IDS 模式只交出接收端确认过的数据，</text><text x="974.0" y="593" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">没被接收的数据不会被当成真的；</text><text x="974.0" y="612" text-anchor="start" font-size="11.5" font-weight="400" fill="#52514e">inline 模式要先判再转发，收到就处理。</text></svg>